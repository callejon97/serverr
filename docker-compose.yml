  overseerr:
    image: sctx/overseerr:latest
    container_name: overseerr
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Europe/Madrid
    volumes:
      - /home/miguel/serverr/data/config/overseerr-config:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped

  # prowlarr:
  #   image: lscr.io/linuxserver/prowlarr:develop
  #   container_name: prowlarr
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - UMASK=002
  #     - TZ=Europe/Madrid
  #   volumes:
  #     - /home/miguel/serverr/data/config/prowlarr-config:/config
  #   ports:
  #     - "9696:9696"
  #   restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
      - PLEX_CLAIM=
    volumes:
      - /home/miguel/serverr/data/config/plex-config:/config
      - /home/miguel/serverr/data/data/media:/data/media
    restart: unless-stopped

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    depends_on:
      - plex
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/miguel/serverr/data/config/tautulli-config:/config
    ports:
      - "8181:8181"
    restart: unless-stopped

  qbittorrent:
    image:  ghcr.io/hotio/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Europe/Madrid
      - WEBUI_PORT=8080
    volumes:
      - /home/miguel/serverr/data/config/qbittorrent-config:/config
      - /home/miguel/serverr/data/data/torrents:/data/torrents
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  # sabnzbd:
  #   image: lscr.io/linuxserver/sabnzbd:latest
  #   container_name: sabnzbd
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - UMASK=002
  #     - TZ=Europe/Madrid
  #   volumes:
  #     - /home/miguel/serverr/data/config/sabnzbd-config:/config
  #     - /home/miguel/serverr/data/data/usenet:/data/usenet
  #   ports:
  #     - "8081:8080"
  #   restart: unless-stopped

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - AUTO_UPDATE=true #optional
    volumes:
      - /home/miguel/serverr/data/config/jackett-config:/config
      - /home/miguel/serverr/data/data/usenet:/data/usenet
    ports:
      - 9117:9117
    restart: unless-stopped

  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - DOCKER_MODS=linuxserver/mods:universal-calibre #optional
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1 #optional
    volumes:
      - /home/miguel/serverr/data/data/media/ebooks:/books
      - /home/miguel/serverr/data/config/jackett-config:/config
    ports:
      - 8083:8083
    restart: unless-stopped

