services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
       - PUID=1000
       - PGID=1000
       - UMASK=002
       - TZ=Europe/Madrid
    volumes:
       - /home/miguel/serverr/data/config/sonarr-config:/config
       - /home/miguel/serverr/data/data:/data
    ports:
       - "8989:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Europe/Madrid
    volumes:
      - /home/miguel/serverr/data/config/radarr-config:/config
      - /home/miguel/serverr/data/data:/data
    ports:
      - "7878:7878"
    restart: unless-stopped

  # mylar3:
